<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">

        <header class="app-header">
            <h1>Secure Dynamic Task Manager</h1>
            <p>Create, edit, complete, and remove tasks dynamically.</p>
        </header>

        <section class="task-form">
            <label for="taskInput">New Task</label>

            <div class="input-row">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                    autocomplete="off"
                >

                <button id="addTaskBtn" type="button">
                    Add Task
                </button>

                <button id="loadSamplesBtn" type="button">
                    Load Sample Tasks
                </button>
            </div>

            <p id="taskMessage" class="task-message"></p>
        </section>

        <section class="summary">
            <div class="summary-card">
                <span class="summary-label">Total Tasks</span>
                <span id="totalCount" class="summary-count">0</span>
            </div>

            <div class="summary-card">
                <span class="summary-label">Pending</span>
                <span id="pendingCount" class="summary-count">0</span>
            </div>

            <div class="summary-card">
                <span class="summary-label">Completed</span>
                <span id="completedCount" class="summary-count">0</span>
            </div>
        </section>

        <section class="tasks-section">
            <h2>Task List</h2>

            <ul id="taskList"></ul>
        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
